name: fullstack-dev-si

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ---------- Accès au socket Docker, Traefik ne monte pas le socket lui-même ----------
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:${SOCKET_PROXY_TAG:-v0.5.0}
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
      - label=disable
    networks: [socket]

  # ---------- Reverse proxy ----------
  traefik:
    <<: *hardened
    image: traefik:${TRAEFIK_TAG:-v3.7}
    restart: unless-stopped
    command:
      - --log=true
      - --global.sendAnonymousUsage=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=true
      - --api.insecure=true
      # Arguments ET variables TRAEFIK_* : Traefik ne lit qu'une source, les variables seraient ignorées
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.network=m2_proxy
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # tableau de bord Traefik
    depends_on: [socket-proxy]
    cap_add:
      - NET_BIND_SERVICE
    networks:
      proxy:
        # Les conteneurs (Rallly) joignent Authelia par son URL publique pour la discovery OIDC.
        aliases:
          - auth.${DOMAIN:?}
          - rallly.${DOMAIN:?}
      socket: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- Authelia : base ----------
  authelia-db:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: authelia
      POSTGRES_DB: authelia
      POSTGRES_PASSWORD: authelia
    volumes:
      - authelia_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authelia -U authelia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  # ---------- Authelia : Application ----------
  authelia:
    <<: *hardened
    image: authelia/authelia:${AUTHELIA_TAG:?}
    # Dépend de Mailpit pour que l'email de confirmation fonctionne.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      mailpit:
        condition: service_started
      authelia-db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config/authelia-dev:/config:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.authelia.rule: Host(`auth.m2.localhost`)
      traefik.http.services.authelia.loadbalancer.server.port: "9091"
      traefik.http.middlewares.authelia.forwardAuth.maxResponseBodySize: '8192'
      traefik.http.middlewares.authelia.forwardauth.address: http://authelia:9091/api/authz/forward-auth
      traefik.http.middlewares.authelia.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.authelia.forwardauth.authResponseHeaders: Remote-User,Remote-Groups,Remote-Email,Remote-Name
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      # Lus par le gabarit de configuration.yml
      # DOMAIN: ${DOMAIN:?}
      # RALLLY_OIDC_CLIENT_ID: ${RALLLY_OIDC_CLIENT_ID:?}
      # AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?}
      # AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?}
      # AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${AUTHELIA_DB_PASSWORD:?}
      # AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?}
      # AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET:?}
    networks: [proxy, backend]


  rallly-db:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    environment:
      POSTGRES_USER: rallly
      POSTGRES_PASSWORD: rallly
      POSTGRES_DB: rallly
    security_opt:
      - no-new-privileges:true
    volumes:
      - rallly_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d rallly -U rallly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]


  rallly:
    <<: *hardened
    image: lukevella/rallly:4
    environment:
      DATABASE_URL: postgres://rallly:rallly@rallly-db:5432/rallly
      NEXT_PUBLIC_BASE_URL: https://rallly.m2.localhost
      SECRET_PASSWORD: dev-only-secret-at-least-32-characters
      SUPPORT_EMAIL: support@m2.localhost
      NOREPLY_EMAIL: noreply@m2.localhost
      # Sans SMTP, Rallly n'envoie pas le code de connexion
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    labels:
      traefik.enable: "true"
      traefik.http.routers.rallly.rule: Host(`rallly.m2.localhost`)
      traefik.http.routers.rallly.middlewares: authelia@docker
      traefik.http.services.rallly.loadbalancer.server.port: "3000"
    depends_on:
      rallly-db:
        condition: service_healthy
      authelia:
        condition: service_healthy
      # garage:
      #   condition: service_started
    networks: [proxy, backend]

  mailpit:
    <<: *hardened
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.mailpit.rule: Host(`mail.m2.localhost`)
      traefik.http.routers.mailpit.middlewares: authelia@docker
      traefik.http.services.mailpit.loadbalancer.server.port: "8025"
    # proxy : Traefik doit joindre l'UI ; backend : Authelia et Rallly y envoient leurs mails
    networks: [proxy, backend]


networks:
  # Réseau vu par Traefik
  proxy:
    name: m2_proxy
  # Bases, stockage : aucun accès extérieur
  backend:
    name: m2_backend
    internal: true
  # Traefik <-> socket-proxy uniquement
  socket:
    name: m2_socket
    internal: true

volumes:
  authelia_db:
  rallly_db: